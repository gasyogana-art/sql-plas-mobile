name: Build iOS Simulator App for Appetize.io

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: |
          flutter build ios --simulator --no-codesign

      - name: Zip Runner.app for Appetize.io
        run: |
          cd build/ios/iphonesimulator
          zip -r -y ../../../VerilogPLAS_iOS_Simulator.zip Runner.app
          cd ../../..

      - name: Upload Appetize-ready iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerilogPLAS_iOS_Simulator_Appetize
          path: VerilogPLAS_iOS_Simulator.zip
